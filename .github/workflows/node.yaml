name: Node pipeline

on:
  push:
    branches: ["main"]

jobs:
  node:
    runs-on: ["wsl-linux"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install packages
        run: npm install

      - name: Run application
        run: |
          node server.js &
          sleep 5
          curl http://localhost:8080
          curl http://localhost:8080/health
          pkill -f "node server.js"
